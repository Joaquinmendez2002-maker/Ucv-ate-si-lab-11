name: Python CI

on:
  push:
    branches: ["main", "feature/lab11"]
  pull_request:
    branches: ["main", "feature/lab11"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r alpha-beta-lab/requirements.txt

      - name: Run tests with coverage
        working-directory: alpha-beta-lab
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term-missing

      # ─── AGREGAR ESTE PASO FINAL PARA ENVIAR LOS DATOS A SONAR ───
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          # Le indicamos a Sonar dónde está el archivo de propiedades en tu subcarpeta
          projectBaseDir: alpha-beta-lab
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}